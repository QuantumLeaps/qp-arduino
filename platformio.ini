[platformio]
; NOTE:
;   This repository builds examples by setting PLATFORMIO_SRC_DIR (via the pixi
;   tasks or tools/pio_task.py, which also gives each example its own build
;   directory). Do not set src_dir here.
lib_dir = src
default_envs = teensy41

[common_env_data]
build_flags =
  -Isrc
; symlink:// links the library source tree instead of copying it into
; .pio/libdeps (a bare path is copied once and never refreshed, so edits to
; src/qp-arduino would silently not be compiled). PlatformIO implements this
; with a .pio-link file, so it also works on Windows without symlink rights.
; The linked library needs a manifest: src/qp-arduino/library.json.
lib_deps_local =
  symlink://src/qp-arduino

[env]
lib_ldf_mode = off
build_flags =
  ${common_env_data.build_flags}
lib_deps =
  ${common_env_data.lib_deps_local}

; -----------------------------------------------------------------------------
; Teensy 4.1 (retained regression set: blinky_bsp, dpp_bsp, port_validation)
; -----------------------------------------------------------------------------
[env:teensy41]
; Pinned to the platform version the retained regression builds use; the
; ledger records the framework/toolchain versions it resolves.
platform = teensy@5.1.0
framework = arduino
board = teensy41
upload_protocol = teensy-cli
; External dependencies for Teensy builds
lib_deps =
  https://github.com/janelia-arduino/TimerOne.git#1.2.0
  ${common_env_data.lib_deps_local}

; -----------------------------------------------------------------------------
; RP2040 qualification fixture: mouse-joystick-pcb rev 0 (PCB tags v0.1/v0.2)
; -----------------------------------------------------------------------------
; Toolchain pinned to the exact set the joystick firmware qualified on this
; board; see UPGRADE_QPCPP_V7.md, "RP2040 Fixture And Toolchain Record":
; platform-raspberrypi 1.14.0 at the commit below, which pins arduino-pico
; 4.2.0 and GCC 14.2.0. A custom RP2040 board, not a Pico: 12 MHz crystal,
; W25Q128JV 16 MiB flash, no LED, no SWD header, no RUN connection. `generic`
; assumes nothing this board lacks. The board's 36 V input must stay unplugged;
; the BSP never enables it and never enables the GPIO isolation bus.
[env:rp2040_mouse_joystick]
platform = https://github.com/janelia-arduino/platform-raspberrypi.git#5e4e06bb9c9971ad003a415bb32796da307b5676
board = generic
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
; 16 MiB, stated so a board-definition change cannot silently shrink the map.
board_upload.maximum_size = 16777216
board_build.filesystem_size = 0m
; Universal single-lane 0x03 read: boots regardless of the flash's quad-enable
; bit. Slower XIP than the Winbond-specific stage 2, fine for qualification.
board_build.arduino.earlephilhower.boot2_source = boot2_generic_03h_4_padded_checksum.S
; The flash unique ID is the USB serial, so the fixture is identifiable from
; /dev/serial/by-id and from a capture's identity beacon later on.
board_build.arduino.earlephilhower.usb_manufacturer = Orb Weaver
board_build.arduino.earlephilhower.usb_product = qp-arduino-rp2040
build_flags =
  ${common_env_data.build_flags}
  -DQP_ARDUINO_FIXTURE_MOUSE_JOYSTICK_PCB=1
  -DQS_ON

; Same fixture with the quad-lane second-stage loader matched to the W25Q128JV
; (faster XIP). Only for boards whose flash the universal loader has already
; proven; used to measure how much of the cold-path cost is XIP cache misses.
[env:rp2040_mouse_joystick_fastflash]
extends = env:rp2040_mouse_joystick
board_build.arduino.earlephilhower.boot2_source = boot2_w25q128jvxq_4_padded_checksum.S

; Same fixture with QS output on UART0 (GP0 TX / GP1 RX), which the fixture
; exposes on InstrumentPort-40 DIG8/DIG7 = LA5032 channels 8/7. The analyzer
; can decode the trace independently of USB, and QSPY can read it through a
; USB-UART adapter on the pyControl RJ-45. No host wait: a UART is always
; "connected".
[env:rp2040_mouse_joystick_uart]
extends = env:rp2040_mouse_joystick
build_flags =
  ${common_env_data.build_flags}
  -DQP_ARDUINO_FIXTURE_MOUSE_JOYSTICK_PCB=1
  -DQS_ON
  -DQP_ARDUINO_QS_SERIAL=Serial1
  -DQP_ARDUINO_QS_HOST_WAIT_MS=0

; Transmit-only observation profile on UART0: no QS-RX processing at all,
; dictionaries re-emitted every 10 s and a TRACE_STAT record every second so a
; capture that misses boot is still decodable and reports its own trace loss.
[env:rp2040_mouse_joystick_txonly]
extends = env:rp2040_mouse_joystick
build_flags =
  ${common_env_data.build_flags}
  -DQP_ARDUINO_FIXTURE_MOUSE_JOYSTICK_PCB=1
  -DQS_ON
  -DQP_ARDUINO_QS_SERIAL=Serial1
  -DQP_ARDUINO_QS_HOST_WAIT_MS=0
  -DQP_ARDUINO_QS_TX_ONLY=1
  -DQP_ARDUINO_QS_DICT_PERIOD_MS=10000
  -DQP_ARDUINO_QS_STAT_PERIOD_MS=1000

; Same fixture with QS output compiled out (the port still compiles with Q_SPY;
; the BSP just never starts QS and sleeps in the idle loop). Used to measure
; the trace transport's share of tick jitter and dispatch latency.
[env:rp2040_mouse_joystick_noqs]
extends = env:rp2040_mouse_joystick
build_flags =
  ${common_env_data.build_flags}
  -DQP_ARDUINO_FIXTURE_MOUSE_JOYSTICK_PCB=1

; -----------------------------------------------------------------------------
; Arduino Due / ATSAM3X8E (retained SAM examples, best effort, not a support claim)
; -----------------------------------------------------------------------------
[env:due]
platform = atmelsam
framework = arduino
board = due
