[platformio]
; NOTE:
;   This repository builds examples by setting PLATFORMIO_SRC_DIR (via the pixi
;   tasks or tools/pio_task.py, which also gives each example its own build
;   directory). Do not set src_dir here.
lib_dir = src
default_envs = pico

[common_env_data]
build_flags =
  -Isrc
; symlink:// links the library source tree instead of copying it into
; .pio/libdeps (a bare path is copied once and never refreshed, so edits to
; src/qp-arduino would silently not be compiled). PlatformIO implements this
; with a .pio-link file, so it also works on Windows without symlink rights.
; The linked library needs a manifest: src/qp-arduino/library.json.
lib_deps_local =
  symlink://src/qp-arduino

[env]
lib_ldf_mode = off
build_flags =
  ${common_env_data.build_flags}
lib_deps =
  ${common_env_data.lib_deps_local}

; -----------------------------------------------------------------------------
; Teensy 4.1 (retained regression set: blinky_bsp, dpp_bsp, port_validation)
; -----------------------------------------------------------------------------
[env:teensy41]
; Pinned to the platform version the retained regression builds use; the
; ledger records the framework/toolchain versions it resolves.
platform = teensy@5.1.0
framework = arduino
board = teensy41
upload_protocol = teensy-cli
; External dependencies for Teensy builds. TimerOne is pinned to the commit the
; retained regression builds were made with (its library.properties says 1.1.1).
lib_deps =
  https://github.com/PaulStoffregen/TimerOne.git#953f2407e313c1866509c1fddff98630071fa3b3
  ${common_env_data.lib_deps_local}

; -----------------------------------------------------------------------------
; RP2040: Raspberry Pi Pico and any other board of the Earle Philhower
; arduino-pico core (the qualified configuration)
; -----------------------------------------------------------------------------
; The community PlatformIO platform for the arduino-pico core, pinned to the
; commit the port was qualified with: platform 1.14.0, which pins arduino-pico
; 4.2.0 (commit c4b6521) and GCC 14.2.0. The examples assume only LED_BUILTIN
; (GP25 on a Pico) and USB CDC, so another board of this core works with
; `board = <name>`; set QP_ARDUINO_LED_PIN if the LED is elsewhere, and
; QP_ARDUINO_TICK_PROBE_PIN to pulse a GPIO from the tick callback for a logic
; analyzer or oscilloscope.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5e4e06bb9c9971ad003a415bb32796da307b5676
board = pico
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
board_build.filesystem_size = 0m
build_flags =
  ${common_env_data.build_flags}
  -DQS_ON

; QS output on UART0 (GP0 TX / GP1 RX) instead of USB CDC: read it with QSPY
; through a USB-UART adapter, or decode it on a logic analyzer alongside the
; probes. No host wait: a UART is always "connected".
[env:pico_uart]
extends = env:pico
build_flags =
  ${common_env_data.build_flags}
  -DQS_ON
  -DQP_ARDUINO_QS_SERIAL=Serial1
  -DQP_ARDUINO_QS_HOST_WAIT_MS=0

; Transmit-only observation profile on UART0: QS-RX is never read, so nothing
; on the trace link can reset, command or poke the target; the dictionaries
; are re-emitted every 10 s and a TRACE_STAT record every second, so a capture
; that misses boot is still decodable and reports its own trace loss.
[env:pico_txonly]
extends = env:pico
build_flags =
  ${common_env_data.build_flags}
  -DQS_ON
  -DQP_ARDUINO_QS_SERIAL=Serial1
  -DQP_ARDUINO_QS_HOST_WAIT_MS=0
  -DQP_ARDUINO_QS_TX_ONLY=1
  -DQP_ARDUINO_QS_DICT_PERIOD_MS=10000
  -DQP_ARDUINO_QS_STAT_PERIOD_MS=1000

; The same transmit-only profile on a PIO UART driving GP21 (any free GPIO
; works), for a board whose hardware UARTs are all spoken for; the tick probe
; is on GP20 so both can be captured together. Blinky only.
[env:pico_pio_trace]
extends = env:pico
build_flags =
  ${common_env_data.build_flags}
  -DQS_ON
  -DQP_ARDUINO_QS_PIO_TX_PIN=21
  -DQP_ARDUINO_TICK_PROBE_PIN=20
  -DQP_ARDUINO_QS_HOST_WAIT_MS=0
  -DQP_ARDUINO_QS_TX_ONLY=1
  -DQP_ARDUINO_QS_DICT_PERIOD_MS=10000
  -DQP_ARDUINO_QS_STAT_PERIOD_MS=1000

; QS output compiled out (the port still compiles with Q_SPY; the BSP just
; never starts QS and sleeps in the idle loop). For baseline timing: the
; trace transport's share of tick jitter and dispatch latency.
[env:pico_noqs]
extends = env:pico
build_flags =
  ${common_env_data.build_flags}

; -----------------------------------------------------------------------------
; Arduino Due / ATSAM3X8E (retained SAM examples, best effort, not a support claim)
; -----------------------------------------------------------------------------
[env:due]
platform = atmelsam
framework = arduino
board = due
